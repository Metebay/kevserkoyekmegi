<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <title>Teslimat App - Şoför Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { app: '#10b981', dark: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .slide-up-card { animation: cardSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes cardSlide { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .toast-enter { animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 min-h-screen w-screen flex flex-col relative pb-6">

    <!-- Özel Mobil Bildirim (Toast) -->
    <div id="toast-container" class="fixed top-0 left-0 right-0 z-50 flex flex-col items-center pointer-events-none px-4 pt-4 gap-2"></div>
    
    <!-- Yükleme Ekranı -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="w-16 h-16 bg-emerald-50 rounded-2xl flex items-center justify-center mb-4 animate-pulse">
            <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <p class="text-sm font-black text-slate-800 tracking-widest uppercase">Giriş Yapılıyor</p>
    </div>

    <!-- Mobil Sticky Header (PWA Hissi) -->
    <header class="bg-dark text-white pt-10 pb-6 px-6 shadow-2xl rounded-b-[2rem] relative z-10 sticky top-0 overflow-hidden">
        <!-- Dekoratif Arka Plan -->
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="flex justify-between items-center mb-6 relative">
            <div>
                <p class="text-emerald-400 text-[11px] font-black uppercase tracking-widest mb-1">Teslimat Sistemi</p>
                <h1 class="text-3xl font-black tracking-tight text-white leading-none">Görevlerim</h1>
            </div>
            <div class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/10 shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
        </div>
        
        <div class="flex gap-4 relative">
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex-1 backdrop-blur-md text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Bekleyen</p>
                <p class="text-3xl font-black text-white" id="stat-pending">0</p>
            </div>
            <div class="bg-emerald-500 border border-emerald-400 rounded-2xl p-4 flex-1 shadow-lg shadow-emerald-500/30 text-center relative overflow-hidden">
                <div class="absolute -right-2 -bottom-2 opacity-20"><svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></div>
                <p class="text-[10px] text-emerald-100 uppercase font-bold tracking-widest mb-1">Teslim</p>
                <p class="text-3xl font-black text-white" id="stat-delivered">0</p>
            </div>
        </div>
    </header>

    <main class="px-5 pt-6 flex-1 relative z-0">
        <div class="flex justify-between items-center mb-4 px-1">
            <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest">Aktif Rota</h2>
            <span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-lg" id="active-count-badge">0 Teslimat</span>
        </div>
        
        <div id="order-list" class="space-y-6">
            <!-- JS ile Kartlar Buraya Yüklenecek -->
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7h2h4dTNA_NuRWlacOP6mxcgRlFjpxHQ",
            authDomain: "sohbet-631fa.firebaseapp.com",
            databaseURL: "https://sohbet-631fa-default-rtdb.firebaseio.com",
            projectId: "sohbet-631fa",
            storageBucket: "sohbet-631fa.firebasestorage.app",
            messagingSenderId: "642336277638",
            appId: "1:642336277638:web:b1d6614994f0ba72167d07"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const fmt = new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' });
        let orders = [];

        window.showToast = (msg, isSuccess = true) => {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div'); 
            const bgColor = isSuccess ? 'bg-emerald-500' : 'bg-red-500';
            t.className = `${bgColor} text-white px-6 py-4 rounded-2xl text-sm font-black shadow-2xl toast-enter flex items-center gap-3 border border-white/20`; 
            const icon = isSuccess ? `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>` : `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
            t.innerHTML = `${icon} <span>${msg}</span>`;
            container.appendChild(t); 
            setTimeout(() => {
                t.style.opacity = '0'; t.style.transform = 'translateY(-20px)'; t.style.transition = 'all 0.3s ease';
                setTimeout(()=>t.remove(), 300);
            }, 3000);
        };

        onAuthStateChanged(auth, async (user) => {
            if(user) { 
                document.getElementById('loading-screen').style.display = 'none';
                onSnapshot(collection(db, 'orders'), s => { 
                    orders = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0)); 
                    renderOrders(); 
                }, err => showToast("İnternet bağlantınızı kontrol edin.", false));
            } else { await signInAnonymously(auth); }
        });

        function renderOrders() {
            // Şoför ataması olan tüm siparişler
            const myOrders = orders.filter(o => o.driverId); 
            
            const today = new Date(); today.setHours(0,0,0,0);
            let pending = 0, deliveredToday = 0;
            let html = '';

            myOrders.forEach((o, index) => {
                const isDelivered = o.status === 'Teslim Edildi';
                const isCancelled = o.status === 'İptal Edildi';
                const oDate = o.createdAt ? o.createdAt.toDate() : new Date();
                
                if(isDelivered && oDate >= today) deliveredToday++;
                
                // Tamamlananları gizle
                if(isDelivered || isCancelled) return; 
                
                pending++;
                
                const itemsHtml = o.items && o.items.length > 0 
                    ? o.items.map(i => `<div class="flex justify-between items-center text-[13px] py-1.5 border-b border-slate-100 last:border-0"><span class="font-bold text-slate-700"><span class="bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded-md mr-1">${i.qty}x</span> ${i.name}</span><span class="text-slate-500 font-bold">${fmt.format(i.price * i.qty)}</span></div>`).join('') 
                    : '<div class="text-xs text-slate-400 font-medium">İçerik detayı yok.</div>';

                let statusBg = 'bg-slate-100 text-slate-700 border border-slate-200';
                if(o.status === 'Bekliyor') statusBg = 'bg-amber-50 text-amber-700 border border-amber-200';
                if(o.status === 'Hazırlanıyor') statusBg = 'bg-orange-50 text-orange-700 border border-orange-200';
                if(o.status === 'Yola Çıktı') statusBg = 'bg-blue-500 text-white shadow-lg shadow-blue-500/30';

                // Google Maps Link
                const mapLink = o.address ? `https://maps.google.com/?q=${encodeURIComponent(o.address)}` : '#';

                html += `
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden slide-up-card relative" style="animation-delay: ${index * 0.05}s">
                        
                        <!-- Header -->
                        <div class="p-6 pb-4">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="text-[10px] font-black text-brand-500 uppercase tracking-widest block mb-1">${o.orderNumber}</span>
                                    <h3 class="font-black text-slate-900 text-2xl leading-tight tracking-tight">${o.customerName}</h3>
                                </div>
                                <span class="text-[10px] font-black px-3 py-1.5 rounded-xl whitespace-nowrap uppercase tracking-wider ${statusBg}">${o.status}</span>
                            </div>
                            
                            <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 relative">
                                <p class="text-sm font-semibold text-slate-700 flex items-start gap-2 pr-10">
                                    <svg class="w-5 h-5 text-emerald-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    ${o.address || 'Adres belirtilmemiş'}
                                </p>
                                <a href="${mapLink}" target="_blank" class="absolute right-3 top-3 w-10 h-10 bg-white border border-slate-200 text-slate-700 rounded-xl flex items-center justify-center shadow-sm active:bg-slate-100 transition">
                                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                                </a>
                                
                                ${o.phone ? `
                                <div class="mt-3 pt-3 border-t border-slate-200">
                                    <a href="tel:${o.phone}" class="flex items-center gap-2 text-sm font-bold text-slate-700 bg-white border border-slate-200 px-4 py-2.5 rounded-xl shadow-sm active:bg-slate-100 w-max transition">
                                        <div class="w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg></div>
                                        ${o.phone}
                                    </a>
                                </div>` : ''}
                            </div>
                        </div>

                        <!-- Sepet -->
                        <div class="px-6 pb-5">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Paket İçeriği</p>
                            <div class="bg-white border border-slate-100 p-3 rounded-2xl shadow-sm">
                                ${itemsHtml}
                            </div>
                            <div class="mt-4 flex justify-between items-end px-1">
                                <span class="font-bold text-slate-400 text-[11px] uppercase tracking-widest">Tahsil Edilecek</span>
                                <span class="text-3xl font-black text-slate-900 tracking-tighter">${fmt.format(o.total)}</span>
                            </div>
                        </div>
                        
                        <!-- Büyük Aksiyon Butonları -->
                        <div class="grid grid-cols-2 p-2 gap-2 bg-slate-50 border-t border-slate-100">
                            <button onclick="updateStatus('${o.id}', 'Yola Çıktı')" class="py-4 font-black text-slate-700 bg-white border border-slate-200 rounded-xl shadow-sm active:bg-slate-100 transition flex justify-center items-center gap-2 text-sm">
                                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Yola Çık
                            </button>
                            <button onclick="updateStatus('${o.id}', 'Teslim Edildi')" class="py-4 font-black text-white bg-emerald-500 rounded-xl shadow-lg shadow-emerald-500/30 active:bg-emerald-600 transition flex justify-center items-center gap-2 text-sm">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Teslim Et
                            </button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-delivered').textContent = deliveredToday;
            document.getElementById('active-count-badge').textContent = `${pending} Teslimat`;
            
            document.getElementById('order-list').innerHTML = html || `
                <div class="text-center bg-transparent py-12 mt-4 slide-up-card">
                    <div class="w-24 h-24 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-2xl font-black text-slate-800 mb-2 tracking-tight">Görev Tamam!</h3>
                    <p class="text-slate-500 font-medium text-sm px-10">Şu an için bekleyen veya sana atanmış yeni bir rota görünmüyor.</p>
                </div>
            `;
        }

        window.updateStatus = async (id, status) => {
            try { 
                await updateDoc(doc(db, 'orders', id), { status }); 
                if(status === 'Teslim Edildi') showToast('Sipariş başarıyla teslim edildi!', true); 
                else showToast('Durum güncellendi: Yola Çıktı', true); 
            } 
            catch(e) { showToast('İşlem başarısız.', false); }
        };
    </script>
</body>
</html>
