<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Şoför Uygulaması</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .glass-header { background: rgba(37, 99, 235, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .active-card { border: 2px solid #3b82f6; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="text-gray-800 min-h-screen w-screen flex flex-col relative pb-safe">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none"></div>
    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="relative w-20 h-20">
            <div class="absolute inset-0 border-4 border-blue-100 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-blue-600 font-bold text-xl">🚚</div>
        </div>
        <p class="mt-4 text-sm font-bold text-gray-500 uppercase tracking-widest">Sistem Yükleniyor</p>
    </div>

    <header class="glass-header text-white px-5 pt-8 pb-6 shadow-xl rounded-b-[2rem] relative z-10">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black tracking-tight leading-none">Aktif Görevler</h1>
                <p class="text-blue-200 text-sm font-medium mt-1 flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> 
                    <span id="header-date-text">Tarih Bekleniyor</span>
                </p>
            </div>
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-md">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
        </div>
        <div class="flex gap-3">
            <div class="bg-white/10 rounded-2xl p-4 flex-1 border border-white/20"><p class="text-[10px] text-blue-200 uppercase font-bold tracking-wider mb-1">Bekleyen</p><p class="text-3xl font-black" id="stat-pending">0</p></div>
            <div class="bg-white/10 rounded-2xl p-4 flex-1 border border-white/20"><p class="text-[10px] text-blue-200 uppercase font-bold tracking-wider mb-1">Teslim Edilen</p><p class="text-3xl font-black" id="stat-delivered">0</p></div>
        </div>
    </header>

    <div class="px-4 pt-6 pb-12 flex-1 flex flex-col relative z-0">
        <div id="order-list" class="space-y-5 flex-1"></div>
    </div>

    <!-- Teslimat & Tahsilat Modalı (YENİ) -->
    <div id="delivery-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden flex flex-col fade-in">
            <div class="px-6 py-5 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h3 class="font-black text-gray-800 text-lg">Tahsilat Bilgisi</h3>
                <button onclick="closeDeliveryModal()" class="text-gray-400 hover:text-gray-800 text-3xl leading-none">&times;</button>
            </div>
            <div class="p-6 space-y-5">
                <div>
                    <label class="block text-[11px] font-black text-gray-400 uppercase tracking-widest mb-2">Alınan Tutar (₺)</label>
                    <input type="number" id="dm-amount" class="w-full border-2 border-gray-200 rounded-2xl p-4 text-2xl font-black text-gray-800 outline-none focus:border-blue-500 transition text-center">
                </div>
                <div>
                    <label class="block text-[11px] font-black text-gray-400 uppercase tracking-widest mb-2">Ödeme Yöntemi</label>
                    <select id="dm-method" class="w-full border-2 border-gray-200 rounded-2xl p-4 text-sm font-bold text-gray-800 outline-none focus:border-blue-500 transition appearance-none bg-white">
                        <option value="Nakit">💵 Nakit (Elden)</option>
                        <option value="Kredi Kartı">💳 Kredi Kartı (POS)</option>
                        <option value="Havale/EFT">🏦 Havale / EFT</option>
                        <option value="Veresiye (Ödenmedi)">📓 Veresiye (Açık Hesap)</option>
                    </select>
                </div>
                <button onclick="confirmDelivery()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-emerald-500/20 transition mt-2 text-lg">Teslimatı Tamamla</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // WA MESSAGE API AYARLARI
        // ==========================================
        const WA_API_KEY = "3bcbbb6a-2aa9-4e6f-a9ed-f58fb45c330f";
        const WA_API_URL = "https://api.toplusms.app/wp/send/message"; // Kendi linkinizle değiştirin
        const WA_REG_ID = "3291916684"; // WhatsApp Cihaz ID'niz
        // ==========================================

        const firebaseConfig = {
            apiKey: "AIzaSyC7h2h4dTNA_NuRWlacOP6mxcgRlFjpxHQ",
            authDomain: "sohbet-631fa.firebaseapp.com",
            databaseURL: "https://sohbet-631fa-default-rtdb.firebaseio.com",
            projectId: "sohbet-631fa",
            storageBucket: "sohbet-631fa.firebasestorage.app",
            messagingSenderId: "642336277638",
            appId: "1:642336277638:web:b1d6614994f0ba72167d07"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let orders = [];
        
        // Ekran Tarihi
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('header-date-text').textContent = new Date().toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        window.showToast = (msg) => {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div'); t.className = 'bg-gray-900 text-white px-5 py-3.5 rounded-2xl text-sm font-bold shadow-2xl fade-in text-center'; t.textContent = msg;
            c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(()=>t.remove(),300); }, 2500);
        };

        async function sendWaMessage(phoneRaw, messageText) {
            if(!phoneRaw) return;
            
            // Telefon formatlama
            let phone = phoneRaw.replace(/\D/g, '');
            if(phone.startsWith('0')) phone = phone.substring(1);
            if(phone.length === 10) phone = '90' + phone;
            phone = '+' + phone;

            try {
                await fetch(WA_API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'X-Api-Key': WA_API_KEY 
                    },
                    body: JSON.stringify({ 
                        phone: phone, 
                        message: messageText,
                        reg_id: WA_REG_ID,
                        device_id: WA_REG_ID,
                        instance_id: WA_REG_ID
                    })
                });
                console.log("Mesaj şoför ekranından tetiklendi");
            } catch(e) { 
                console.error("WA Api Hatası:", e); 
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if(user) { 
                document.getElementById('loading-screen').style.opacity = '0'; setTimeout(()=>document.getElementById('loading-screen').classList.add('hidden'), 300);
                onSnapshot(collection(db, 'orders'), s => { 
                    orders = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis()||0)-(a.createdAt?.toMillis()||0)); 
                    renderOrders(); 
                });
            } else { await signInAnonymously(auth); }
        });

        function renderOrders() {
            // SADECE Bugüne ait (Tarihi bugün olan) ve bir şoföre atanmış siparişleri getir
            const todayOrders = orders.filter(o => {
                if(!o.driverId) return false;
                const orderDate = o.deliveryDate || (o.createdAt ? o.createdAt.toDate().toISOString().split('T')[0] : '');
                return orderDate === todayStr;
            }); 
            
            let pending = 0, deliveredToday = 0;
            let html = '';

            todayOrders.forEach(o => {
                const isDelivered = o.status === 'Teslim Edildi';
                const isCancelled = o.status === 'İptal Edildi';
                
                if(isDelivered) { deliveredToday++; return; } // Teslim edilenleri listede gösterme
                if(isCancelled) return; 
                
                pending++;
                
                const itemsHtml = o.items ? o.items.map(i => `<div class="flex justify-between text-sm py-1.5 border-b border-gray-100 last:border-0"><span class="font-bold text-gray-700">${i.qty}x <span class="font-medium">${i.name}</span></span><span class="text-gray-900 font-bold">₺${i.total}</span></div>`).join('') : '';
                const mapLink = o.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}` : '#';

                html += `
                    <div class="bg-white rounded-[1.5rem] shadow-sm border border-gray-200 p-5 relative fade-in ${o.status === 'Yola Çıktı' ? 'active-card' : ''}">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-[10px] font-black text-gray-400 block mb-1 tracking-widest">${o.orderNumber}</span>
                                <h3 class="font-black text-gray-900 text-xl leading-tight">${o.customerName}</h3>
                            </div>
                            <span class="text-[10px] font-bold uppercase tracking-wider bg-blue-50 text-blue-700 border border-blue-100 px-3 py-1.5 rounded-full">${o.status}</span>
                        </div>
                        
                        <div class="bg-gray-50/50 border border-gray-100 rounded-2xl p-4 mb-4">
                            <p class="text-sm font-medium text-gray-700 flex items-start gap-2">
                                <svg class="w-5 h-5 text-gray-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                <span>${o.address || '-'}</span>
                            </p>
                            <div class="flex gap-2 mt-3 ml-7">
                                <a href="${mapLink}" target="_blank" class="text-[11px] font-bold bg-gray-200/50 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">Harita</a>
                                ${o.phone ? `<a href="tel:${o.phone}" class="text-[11px] font-bold bg-green-50 hover:bg-green-100 text-green-700 px-3 py-1.5 rounded-lg transition border border-green-100">Ara: ${o.phone}</a>` : ''}
                            </div>
                        </div>

                        <div class="mb-5 bg-blue-50/30 rounded-2xl p-4 border border-blue-100/50">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 border-b border-gray-100 pb-2">Paket İçeriği</p>
                            ${itemsHtml}
                            <div class="mt-3 pt-3 border-t border-gray-200 flex justify-between items-end">
                                <span class="font-bold text-gray-500 text-xs">Tahsilat:</span>
                                <span class="text-2xl font-black text-gray-900 leading-none">₺${o.total.toLocaleString('tr-TR')}</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="updateStatus('${o.id}', 'Yola Çıktı')" class="bg-blue-50 text-blue-700 hover:bg-blue-100 py-4 rounded-xl font-bold transition flex flex-col justify-center items-center gap-1">
                                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> <span class="text-xs uppercase tracking-wider">Yola Çık</span>
                            </button>
                            <button onclick="openDeliveryModal('${o.id}', ${o.total})" class="bg-gray-900 text-white hover:bg-black py-4 rounded-xl font-bold shadow-xl shadow-gray-900/20 transition flex flex-col justify-center items-center gap-1">
                                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="text-xs uppercase tracking-wider text-emerald-400">Teslim Et</span>
                            </button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-delivered').textContent = deliveredToday;
            document.getElementById('order-list').innerHTML = html || `
                <div class="flex flex-col items-center justify-center h-full text-center mt-12 fade-in">
                    <div class="w-24 h-24 bg-white shadow-xl shadow-blue-100 rounded-full flex items-center justify-center mb-6">
                        <span class="text-4xl">🎉</span>
                    </div>
                    <h3 class="text-2xl font-black text-gray-800 mb-2">Harika İş!</h3>
                    <p class="text-gray-500 font-medium px-8">Bugün için sana atanmış bekleyen bir sipariş kalmadı.</p>
                </div>
            `;
        }

        window.updateStatus = async (id, status) => {
            try { 
                await updateDoc(doc(db, 'orders', id), { status }); 
                showToast(status === 'Teslim Edildi' ? '✅ Teslimat Başarılı!' : '🚚 Yola Çıktı!'); 
            } 
            catch(e) { showToast('Bağlantı hatası!'); }
        };

        // YENİ: Tahsilat Modal Fonksiyonları
        let currentDeliveryOrderId = null;
        
        window.openDeliveryModal = (id, total) => {
            currentDeliveryOrderId = id;
            document.getElementById('dm-amount').value = total; // Varsayılan olarak toplam tutarı getir
            document.getElementById('dm-method').value = 'Nakit';
            document.getElementById('delivery-modal').classList.remove('hidden');
        };
        
        window.closeDeliveryModal = () => {
            document.getElementById('delivery-modal').classList.add('hidden');
            currentDeliveryOrderId = null;
        };
        
        window.confirmDelivery = async () => {
            if(!currentDeliveryOrderId) return;
            
            const amount = Number(document.getElementById('dm-amount').value);
            const method = document.getElementById('dm-method').value;
            
            try { 
                await updateDoc(doc(db, 'orders', currentDeliveryOrderId), { 
                    status: 'Teslim Edildi',
                    collectedAmount: amount,
                    paymentMethod: method,
                    deliveredAt: new Date().toISOString() // YENİ: Teslim edilen anın saat/tarih kaydı
                }); 
                closeDeliveryModal();
                showToast('✅ Tahsilat ve Teslimat Kaydedildi!'); 
            } catch(e) { 
                showToast('Hata: İnternet bağlantınızı kontrol edin!'); 
            }
        };
    </script>
</body>
</html>
